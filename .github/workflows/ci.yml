name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax (compileall)
        run: |
          python -m compileall -q .

  tests:
    runs-on: ubuntu-latest
    needs: syntax
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Optional visualization deps (best effort)
          pip install matplotlib quantstats || true
          pip install pandas numpy optuna scikit-learn scipy
      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest -q

